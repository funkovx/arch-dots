general {
    lock_cmd = pidof hyprlock || hyprlock       # что запускать при блокировке
    before_sleep_cmd = loginctl lock-session    # блокировать перед сном
    after_sleep_cmd = hyprctl dispatch dpms on  # включить экран после просыпания
}

# Сценарий: выключить монитор через 15 секунд, если экран ЗАБЛОКИРОВАН
listener {
    timeout = 15                                
    on-timeout = pidof hyprlock && hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on        
}

# Сценарий: автоматическая блокировка через 5 минут бездействия (опционально)
listener {
    timeout = 300                               
    on-timeout = loginctl lock-session          
}
