general {
    no_fade_in = false
    grace = 0
    disable_loading = false
    ignore_empty_input = true
}

background {
    monitor =
    color = rgba(29, 32, 33, 1.0)
    blur_passes = 2
    blur_size = 4
}

# Clock
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(235, 219, 178, 1.0)
    font_size = 72
    font_family = JetBrainsMono Nerd Font Bold
    rotate = 0

    position = 0, 120
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %d %B")"
    color = rgba(168, 153, 132, 1.0)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    rotate = 0

    position = 0, 40
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 52
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(250, 189, 47, 0.8)
    inner_color = rgba(60, 56, 54, 0.85)
    font_color = rgb(235, 219, 178)
    check_color = rgba(184, 187, 38, 1.0)
    fail_color = rgba(251, 73, 52, 1.0)
    fade_on_empty = false
    placeholder_text = <i>Password...</i>
    hide_input = false
    rounding = 8

    position = 0, -60
    halign = center
    valign = center
}

# Keyboard layout indicator
label {
    monitor =
    text = $LAYOUT
    color = rgba(146, 131, 116, 1.0)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    rotate = 0

    position = -30, 30
    halign = right
    valign = bottom
}
