general {
    no_fade_in = false
    grace = 0
    disable_loading = false
    ignore_empty_input = true
}

background {
    monitor =
    color = rgba(25, 20, 20, 1.0)
    blur_passes = 1
}

input-field {
    monitor =
    size = 250, 60
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(100, 100, 100, 0.5)
    font_color = rgb(200, 200, 200)
    fade_on_empty = false
    placeholder_text = <i>Password...</i>
    hide_input = false
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $LAYOUT
    color = rgba(200, 200, 200, 1.0)
    font_size = 16
    font_family = Noto Sans
    rotate = 0 

    position = -30, 30
    halign = right
    valign = bottom
}