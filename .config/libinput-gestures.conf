# Hyprland 0.55+ Lua dispatchers. Three-finger swipes are also configured
# natively in hyprland.lua; leave libinput-gestures stopped when using those.

# 3-finger swipe → switch workspaces
gesture swipe right 3 hyprctl dispatch 'hl.dsp.focus({ workspace = "e-1" })'
gesture swipe left  3 hyprctl dispatch 'hl.dsp.focus({ workspace = "e+1" })'

# 4-finger swipe left/right → cycle through open windows
gesture swipe right 4 hyprctl dispatch 'hl.dsp.window.cycle_next()'
gesture swipe left  4 hyprctl dispatch 'hl.dsp.window.cycle_next({ next = false })'

# 4-finger swipe up → fullscreen
gesture swipe up   4 hyprctl dispatch 'hl.dsp.window.fullscreen({ mode = 0 })'

# 4-finger swipe down → close window
gesture swipe down 4 hyprctl dispatch 'hl.dsp.window.close()'
