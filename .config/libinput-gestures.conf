gesture_delay 1

# 3-finger swipe → switch workspaces
gesture swipe right 3 hyprctl dispatch workspace e-1
gesture swipe left  3 hyprctl dispatch workspace e+1

# 4-finger swipe left/right → cycle through open windows
gesture swipe right 4 hyprctl dispatch cyclenext
gesture swipe left  4 hyprctl dispatch cyclenext prev

# 4-finger swipe up → fullscreen
gesture swipe up   4 hyprctl dispatch fullscreen 0

# 4-finger swipe down → close window
gesture swipe down 4 hyprctl dispatch killactive
